<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>OpenShorts — Kesit Studio</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#09090b;color:#fff;margin:0;padding:20px}
main{max-width:620px;margin:auto}
.hero{text-align:center;padding:28px 8px 20px}
h1{font-size:34px;margin:0 0 10px}
p{color:#a1a1aa;line-height:1.45}
.card{background:#18181b;border:1px solid #27272a;border-radius:22px;padding:20px;margin:14px 0}
label{display:block;font-size:14px;color:#d4d4d8;margin-bottom:8px}
input,button{width:100%;padding:16px;border-radius:14px;border:0;font-size:16px}
input{background:#fff;color:#111}
button{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:800;margin-top:14px;font-size:18px}
.status{display:none;margin-top:14px;padding:13px;border-radius:12px;background:#27272a;color:#d4d4d8;font-size:14px}
a{display:block;text-align:center;text-decoration:none;background:#27272a;color:#fff;padding:15px;border-radius:14px;font-weight:800}
.hint{font-size:12px;color:#71717a;margin-bottom:0}
</style>
</head>
<body>
<main>
<section class="hero">
<h1>🎬 OpenShorts</h1>
<p>Uzun videonu otomatik olarak kısa, dikey kesitlere dönüştür.</p>
</section>

<div class="card">
<label for="url">YouTube video linki</label>
<input id="url" type="url" inputmode="url" autocomplete="off"
       placeholder="https://youtube.com/watch?v=...">
<p class="hint">Linki yapıştır ve oluştur'a bas. Gerisini sistem yapacak.</p>
<button onclick="start()">🚀 KESİTLERİ OLUŞTUR</button>
<div id="status" class="status"></div>
</div>

<div class="card">
<a href="/results">📦 Kesitler / İşlem Durumu</a>
</div>
</main>

<script>
function setStatus(msg){
  const el=document.getElementById('status');
  el.style.display='block';
  el.textContent=msg;
}

async function start(){
  const u=document.getElementById('url').value.trim();
  if(!u){setStatus('❌ YouTube linki gir.');return;}
  if(!/(youtube\.com|youtu\.be)/i.test(u)){
    setStatus('❌ Geçerli bir YouTube linki gir.');
    return;
  }

  setStatus('⏳ İşlem başlatılıyor…');
  try{
    const r=await fetch('/.netlify/functions/upload?action=init',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({
        filename:'youtube.txt',
        size:0,
        chunks:0,
        youtubeUrl:u,
        clipCount:3,
        layout:'auto',
        subtitleStyle:'bold'
      })
    });
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||'İstek başlatılamadı');

    setStatus('⏳ Video işleme kuyruğuna alınıyor…');
    const run=await fetch('/.netlify/functions/upload?action=finish&id='+encodeURIComponent(j.uploadId),{
      method:'POST'
    });
    const runJson=await run.json();
    if(!run.ok) throw new Error(runJson.error||runJson.detail||'İşlem başlatılamadı');

    setStatus('✅ İşlem başladı. Kesitler hazır olduğunda sonuçlar sayfasında görünecek.');
    setTimeout(()=>location.href='/results?refresh=1',900);
  }catch(e){
    setStatus('❌ '+e.message);
  }
}
</script>
</body>
</html>
