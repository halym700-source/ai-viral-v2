name: ReshRanks YouTube CC Archive Direct Download Test
on:
  push:
    paths:
      - '.github/workflows/reshranks_wikimedia_smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  youtube-cc-archived:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download archived YouTube CC motorcycle video from Wikimedia Commons
        run: |
          python - <<'PY'
          import hashlib,urllib.parse,urllib.request,subprocess,json,os,sys
          fn='Riding on the road shoulder on a motorcycle in Queensland.webm'
          name=fn.replace(' ','_')
          md5=hashlib.md5(name.encode('utf-8')).hexdigest()
          url=f'https://upload.wikimedia.org/wikipedia/commons/{md5[0]}/{md5[:2]}/{urllib.parse.quote(name)}'
          print('SOURCE_PAGE: https://commons.wikimedia.org/wiki/File:'+urllib.parse.quote(name),flush=True)
          print('TEST_STAGE: direct_authenticated_free_download',flush=True)
          req=urllib.request.Request(url,headers={'User-Agent':'ReshRanksTesting/1.0 (video-download-compatibility-check)'})
          try:
              with urllib.request.urlopen(req,timeout=25) as resp,open('/tmp/wikimedia_youtube_cc.webm','wb') as out:
                  total=0
                  while True:
                      buf=resp.read(1024*1024)
                      if not buf:break
                      total+=len(buf)
                      if total>27000000:raise RuntimeError('file too big')
                      out.write(buf)
          except Exception as exc:
              print('TEST_RESULT: WIKIMEDIA_DOWNLOAD_FAILED',type(exc).__name__,str(exc)[:230])
              sys.exit(3)
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-of','json','/tmp/wikimedia_youtube_cc.webm']))
          video=any(s['codec_type']=='video' for s in probe['streams'])
          audio=any(s['codec_type']=='audio' for s in probe['streams'])
          print('TEST_RESULT: WIKIMEDIA_DOWNLOAD_OK',flush=True)
          print('FILE_BYTES:',total,'HAS_VIDEO:',video,'HAS_ORIGINAL_AUDIO:',audio,flush=True)
          if not (video and audio):sys.exit(4)
          PY
      - name: Preserve test video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: reshranks-youtube-cc-archive-test
          path: /tmp/wikimedia_youtube_cc.webm
          if-no-files-found: error
          retention-days: 2
