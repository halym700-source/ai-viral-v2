name: TextVibe Private Preview (No YouTube)
# Reference avatar preview; never includes YouTube upload.
on:
  push:
    paths:
      - '.github/workflows/chat_preview_only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0 pydub==0.25.1 edge-tts==7.3.1 imageio-ffmpeg==0.6.0 numpy==2.2.6
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg espeak
          fi
      - name: Verify offline TTS fallback
        run: |
          if ! command -v espeak >/dev/null 2>&1; then sudo apt-get install -y -qq espeak; fi
      # One-off private preview: simplified header photo and only bottom-left narrator, no YouTube upload.
      - name: Generate private test video (no upload)
        env:
          CHAT_LANG: en
          CHAT_TTS_PROVIDER: edge
          CHAT_PREVIEW_FALLBACK_TTS: '1'
          CHAT_JSON: '{"chatTitle":"Sophie","dialogue":[{"speaker":"me","text":"Why did you text my dad a heart?"},{"speaker":"girlfriend","text":"I thought that was your number!"},{"speaker":"me","text":"He replied: See you tonight."},{"speaker":"girlfriend","text":"Wait, WHAT?"},{"speaker":"me","text":"He also sent a flower emoji."},{"speaker":"girlfriend","text":"Your dad is just being nice."},{"speaker":"me","text":"He asked about wedding plans."},{"speaker":"girlfriend","text":"Our wedding plans?"},{"speaker":"me","text":"He says he booked the venue."},{"speaker":"girlfriend","text":"How is he this fast?"},{"speaker":"me","text":"It''s a pizza place."},{"speaker":"girlfriend","text":"Okay. I love your dad."}]}'
        run: python chat_renderer/render.py
      - name: Store MP4 for review (not YouTube)
        uses: actions/upload-artifact@v4
        with:
          name: textvibe-preview-only
          path: out/short.mp4
          if-no-files-found: error
          retention-days: 2
