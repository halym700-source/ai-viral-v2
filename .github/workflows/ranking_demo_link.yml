name: Publish browser-playable ranking demo
on:
  push:
    paths:
      - '.github/workflows/ranking_demo_link.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0 imageio-ffmpeg==0.6.0
          mkdir -p "$RUNNER_TEMP/rank-bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/rank-bin/ffmpeg"
          echo "$RUNNER_TEMP/rank-bin" >> "$GITHUB_PATH"
      - name: Produce 24-second demo
        run: python ranking_renderer/smoke_test.py
      - name: Publish demo MP4 at permanent raw URL
        run: |
          mkdir -p previews
          cp out/ranking_short.mp4 previews/ranking_demo.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f previews/ranking_demo.mp4
          git commit -m "Publish mobile-playable 24-second ranking preview"
          git push
