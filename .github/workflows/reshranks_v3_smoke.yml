name: ReshRanks V3 REAL YouTube Download Smoke
on:
  push:
    paths:
      - '.github/workflows/reshranks_v3_smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install yt-dlp
        run: python -m pip install --quiet --upgrade 'yt-dlp[default]'
      - name: CC-BY search and direct download smoke test (NO UPLOAD)
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY || secrets.YOUTUBE_RESEARCH_API_KEY }}
          RESH_WORK: ${{ runner.temp }}/resh-smoke
        run: |
          python - <<'PY'
          import os,sys,subprocess
          from pathlib import Path
          if not os.getenv('YOUTUBE_DATA_API_KEY'):
              print('TEST_RESULT: YOUTUBE_API_KEY_MISSING')
              sys.exit(2)
          from reshranks_autopilot.discover import find_candidates, THEMES
          print('TEST_STAGE: CC_BY_SEARCH',flush=True)
          try: candidates=find_candidates(THEMES[0], set())
          except Exception as e:
              print('TEST_RESULT: API_SEARCH_FAILED:',type(e).__name__,str(e)[:140])
              sys.exit(3)
          print('CANDIDATES:',len(candidates),flush=True)
          if not candidates:
              print('TEST_RESULT: NO_CC_BY_CANDIDATES')
              sys.exit(4)
          out=Path(os.environ['RESH_WORK']);out.mkdir(parents=True,exist_ok=True)

          clients=['tv,web_safari','android','ios','web_embedded']
          for ci, client in enumerate(clients):
              source=candidates[ci % min(len(candidates),3)]
              dest=out/f'client_{ci}.%(ext)s'
              args=['yt-dlp','--no-playlist','--no-progress','--no-warnings',
                    '--socket-timeout','10','--retries','0','--fragment-retries','0',
                    '--extractor-args',f'youtube:player_client={client}',
                    '--max-filesize','35M','-f','b[height<=480]/b',
                    '-o',str(dest),source['url']]
              print('CLIENT_DOWNLOAD_ATTEMPT:',ci+1,client,source['video_id'],flush=True)
              try: p=subprocess.run(args,capture_output=True,text=True,timeout=50)
              except subprocess.TimeoutExpired:
                  print('CLIENT_DOWNLOAD_FAILED: timeout',flush=True);continue
              files=list(out.glob(f'client_{ci}.*'))
              if p.returncode==0 and len(files)==1 and files[0].stat().st_size>100000:
                  print('TEST_RESULT: CC_BY_SEARCH_AND_DOWNLOAD_OK',flush=True)
                  print('DOWNLOADED_BYTES:',files[0].stat().st_size,flush=True)
                  sys.exit(0)
              print('CLIENT_DOWNLOAD_FAILED: exit',p.returncode,'details',p.stderr[-350:].replace(chr(10),' '),flush=True)
          print('TEST_RESULT: YOUTUBE_DOWNLOAD_FAILED_ALL_CLIENTS')
          sys.exit(5)
          PY
