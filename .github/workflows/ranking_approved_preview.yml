name: ReshRanks Approved Real Footage Preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify five authentic rights-approved source entries
        run: python ranking_renderer/approved_manifest.py
      - name: Install video tools
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0 imageio-ffmpeg==0.6.0 edge-tts==7.3.1
          mkdir -p "$RUNNER_TEMP/rank-bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/rank-bin/ffmpeg"
          echo "$RUNNER_TEMP/rank-bin" >> "$GITHUB_PATH"
      - name: Render only approved real footage
        env:
          RANKING_MANIFEST: out/ranking_manifest.json
        run: python ranking_renderer/render.py
      - name: Save private preview and source audit
        uses: actions/upload-artifact@v4
        with:
          name: reshranks-approved-real-footage-${{ github.run_id }}
          path: |
            out/ranking_short.mp4
            out/ranking_manifest.json
            out/ranking_sources.json
          retention-days: 7
          if-no-files-found: error
