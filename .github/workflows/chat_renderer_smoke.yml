name: TextVibe Renderer Smoke Test

on:
  push:
    paths:
      - 'chat_renderer/render.py'
      - 'chat_renderer/pastel_layout.py'
      - 'chat_renderer/reference_layout.py'
      - 'chat_renderer/reference_assets.json'
      - 'chat_renderer/reference_assets.json'
      - 'chat_renderer/smoke_test.py'
      - '.github/workflows/chat_renderer_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render dependencies
        run: |
          # Static FFmpeg via PyPI avoids Ubuntu apt mirrors, which stalled.
          python -m pip install --disable-pip-version-check pillow==11.3.0 pydub==0.25.1 edge-tts==7.3.1 imageio-ffmpeg==0.6.0 numpy==2.2.6
          mkdir -p "$RUNNER_TEMP/textvibe-bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/textvibe-bin/ffmpeg"
          echo "$RUNNER_TEMP/textvibe-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/textvibe-bin/ffmpeg" -version | head -n 1
      - name: Compile and render offline example
        run: |
          python -m compileall -q chat_renderer
          python chat_renderer/smoke_test.py
      - name: Upload preview for review
        uses: actions/upload-artifact@v4
        with:
          name: textvibe-smoke-preview
          path: |
            out/smoke-preview.png
            out/short.mp4
          if-no-files-found: error
          retention-days: 2
