name: Assemble HPC Cat MP4
on:
  push:
    paths:
      - "video_exports/hpc_parts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify MP4
        shell: bash
        run: |
          mkdir -p video_exports
          cat video_exports/hpc_parts/part-*.b64 | base64 --decode > video_exports/KEDI_HPC_FINAL.mp4
          echo "769f4524ea67ece9a166e0596af53f005bff49601a986dc600302680cc41b0d7  video_exports/KEDI_HPC_FINAL.mp4" | sha256sum --check
          file video_exports/KEDI_HPC_FINAL.mp4
      - name: Commit MP4 to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video_exports/KEDI_HPC_FINAL.mp4
          git commit -m "Add completed cat HPC video MP4"
          git push
