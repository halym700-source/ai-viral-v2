name: ReshRanks Direct Licensed Video Downloader Smoke
on:
  push:
    paths:
      - '.github/workflows/reshranks_direct_media_smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pexels:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - name: Install FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -qq -y ffmpeg
      - name: Search Pexels and download licensed motorcycle MP4
        run: |
          python - <<'PY'
          import json,os,subprocess,sys,urllib.request,urllib.parse
          key=os.getenv('PEXELS_API_KEY','')
          if not key:
              print('PEXELS: MISSING_API_KEY')
              sys.exit(0)
          qs=urllib.parse.urlencode({'query':'motorcycle','per_page':35})
          url='https://api.pexels.com/v1/videos/search?'+qs
          try:
              req=urllib.request.Request(url,headers={'Authorization':key})
              with urllib.request.urlopen(req,timeout=20) as r: data=json.load(r)
          except Exception as e:
              print('PEXELS: API_FAILED',type(e).__name__,str(e)[:80]);sys.exit(0)
          vids=data.get('videos',[])
          print('PEXELS: MATCHES',len(vids),flush=True)
          for item in vids[:15]:
              mp4=sorted((f for f in item.get('video_files',[]) if f.get('file_type')=='video/mp4' and f.get('link')),
                         key=lambda x: (x.get('width',720) or 720)*(x.get('height',1280) or 1280))
              for f in mp4[:2]:
                  path='/tmp/pexels_test.mp4'
                  try:
                      req=urllib.request.Request(f['link'],headers={'User-Agent':'ReshRanksVideoTest/1.0'})
                      with urllib.request.urlopen(req,timeout=25) as inp,open(path,'wb') as out:
                          total=0
                          while True:
                              chunk=inp.read(1024*1024)
                              if not chunk:break
                              total+=len(chunk)
                              if total>30000000:raise ValueError('size>30MB')
                              out.write(chunk)
                      probe=json.loads(subprocess.check_output(['ffprobe','-v','quiet','-show_streams','-of','json',path],timeout=12))
                      video=any(s['codec_type']=='video' for s in probe['streams'])
                      audio=any(s['codec_type']=='audio' for s in probe['streams'])
                      print('PEXELS: MP4_DOWNLOAD_OK',total,'VIDEO',video,'ORIGINAL_AUDIO',audio,'SOURCE',item.get('url'),flush=True)
                      sys.exit(0)
                  except Exception as e:
                      print('PEXELS: CANDIDATE_FAILED',type(e).__name__,str(e)[:75],flush=True)
          print('PEXELS: NO_DOWNLOADABLE_MP4')
          PY
  pixabay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - name: Install FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -qq -y ffmpeg
      - name: Search Pixabay and download licensed motorcycle MP4
        run: |
          python - <<'PY'
          import json,os,subprocess,sys,urllib.request,urllib.parse
          key=os.getenv('PIXABAY_API_KEY','')
          if not key:
              print('PIXABAY: MISSING_API_KEY')
              sys.exit(0)
          qs=urllib.parse.urlencode({'key':key,'q':'motorcycle','per_page':100,'video_type':'film'})
          url='https://pixabay.com/api/videos/?'+qs
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'ReshRanksVideoTest/1.0'})
              with urllib.request.urlopen(req,timeout=22) as r: data=json.load(r)
          except Exception as e:
              print('PIXABAY: API_FAILED',type(e).__name__,str(e)[:80]);sys.exit(0)
          items=data.get('hits',[])
          print('PIXABAY: MATCHES',len(items),flush=True)
          for item in items[:20]:
              files=item.get('videos') or {}
              for q in ('small','medium','tiny'):
                  f=files.get(q) or {}
                  link=f.get('url','')
                  if not link:continue
                  path='/tmp/pixabay_test.mp4'
                  try:
                      req=urllib.request.Request(link,headers={'User-Agent':'ReshRanksVideoTest/1.0'})
                      with urllib.request.urlopen(req,timeout=20) as inp,open(path,'wb') as out:
                          total=0
                          while True:
                              chunk=inp.read(1024*1024)
                              if not chunk:break
                              total+=len(chunk)
                              if total>30000000:raise ValueError('size>30MB')
                              out.write(chunk)
                      streams=json.loads(subprocess.check_output(['ffprobe','-v','quiet','-show_streams','-of','json',path],timeout=12))['streams']
                      video=any(s['codec_type']=='video' for s in streams)
                      audio=any(s['codec_type']=='audio' for s in streams)
                      print('PIXABAY: MP4_DOWNLOAD_OK',total,'VIDEO',video,'ORIGINAL_AUDIO',audio,'SOURCE',item.get('pageURL'),flush=True)
                      sys.exit(0)
                  except Exception as e:
                      print('PIXABAY: CANDIDATE_FAILED',type(e).__name__,str(e)[:75],flush=True)
          print('PIXABAY: NO_DOWNLOADABLE_MP4')
          PY
