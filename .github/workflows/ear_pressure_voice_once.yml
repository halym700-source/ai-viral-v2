name: Ear Pressure 3D Short Narration
on:
  push:
    paths:
      - '.github/workflows/ear_pressure_voice_once.yml'
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Synthesize original English narration
        run: |
          python -m pip install -q edge-tts
          mkdir -p narration
          python - <<'PY'
          import asyncio,edge_tts
          chunks=[
           "Ever notice your ears pop when a plane takes off?",
           "That's air pressure pushing against your eardrum.",
           "Behind it is a tiny air-filled space called the middle ear.",
           "As cabin pressure changes, your eardrum stretches.",
           "When you swallow, this small tube opens, equalizing the pressure. That's the pop!"
          ]
          async def go():
           for i,s in enumerate(chunks):
            await edge_tts.Communicate(s,voice='en-US-AndrewMultilingualNeural',rate='-8%').save(f'narration/{i:02d}.mp3')
            print('Made segment',i)
          asyncio.run(go())
          PY
      - name: Export MP3 narration
        uses: actions/upload-artifact@v4
        with:
          name: ear-pressure-english-voice
          path: narration/*.mp3
          if-no-files-found: error
          retention-days: 1
