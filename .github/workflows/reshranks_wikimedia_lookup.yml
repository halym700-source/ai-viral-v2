name: ReshRanks Wikimedia YouTube ID Mirror Lookup
on:
  push:
    paths:
      - '.github/workflows/reshranks_wikimedia_lookup.yml'
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Search Commons mirror of known CC YouTube video by ID and title
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request
          tests=[
          'R-YJw6-Sshk',
          '"R-YJw6-Sshk"',
          'insource:"R-YJw6-Sshk"',
          '"Riding on the road shoulder on a motorcycle in Queensland"'
          ]
          for q in tests:
              args=urllib.parse.urlencode({'action':'query','list':'search','srsearch':q,'srnamespace':'6','srlimit':'10','format':'json'})
              url='https://commons.wikimedia.org/w/api.php?'+args
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'ReshRanksTest/1.0 (cc-by-video-archive-discovery)'})
                  with urllib.request.urlopen(req,timeout=17) as r: data=json.load(r)
                  rows=data.get('query',{}).get('search',[])
                  print('QUERY:',q,'RESULTS:',len(rows),'TITLES:',[v['title'] for v in rows[:5]],flush=True)
              except Exception as e:
                  print('QUERY:',q,'ERROR:',type(e).__name__,str(e)[:180],flush=True)
          PY
