name: Kesit Studio - Free YouTube Clips

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube video URL"
        required: true
        type: string
      clip_count:
        description: "Number of clips"
        required: true
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: kesit-studio-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check -U yt-dlp
      - name: Install FFmpeg
        uses: FedericoCarbonara/setup-ffmpeg@v3
      - name: Run free clip pipeline
        env:
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          CLIP_COUNT: ${{ inputs.clip_count }}
        run: python kesit_studio/free_pipeline.py --url "$YOUTUBE_URL" --count "$CLIP_COUNT"
      - name: Package ZIP
        run: |
          cd out
          zip -r "../kesit-studio-${{ github.run_id }}.zip" .
      - name: Upload MP4, SRT and metadata
        uses: actions/upload-artifact@v4
        with:
          name: kesit-studio-${{ github.run_id }}
          path: |
            out/*.mp4
            out/*.srt
            out/metadata.json
            out/manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kesit-studio-zip-${{ github.run_id }}
          path: kesit-studio-${{ github.run_id }}.zip
          retention-days: 7
          if-no-files-found: error
