name: Kesit Studio - Free YouTube Clips

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube video URL"
        required: true
        type: string
      clip_count:
        description: "Number of clips"
        required: true
        default: "5"
        type: string
  issues:
    types: [opened]
  push:
    paths:
      - 'kesit_studio/requests/**'

permissions:
  contents: read

concurrency:
  group: kesit-studio-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || startsWith(github.event.issue.title, '[Kesit Studio]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video AI dependencies
        run: |
          python -m pip install --disable-pip-version-check -U yt-dlp faster-whisper
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Prepare request inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_URL: ${{ inputs.youtube_url }}
          DISPATCH_COUNT: ${{ inputs.clip_count }}
          ISSUE_URL: ${{ github.event.issue.body }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "YOUTUBE_URL=$DISPATCH_URL" >> "$GITHUB_ENV"
            echo "CLIP_COUNT=$DISPATCH_COUNT" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "issues" ]; then
            echo "YOUTUBE_URL=$ISSUE_URL" >> "$GITHUB_ENV"
            echo "CLIP_COUNT=3" >> "$GITHUB_ENV"
          else
            echo "YOUTUBE_URL=$(head -n 1 kesit_studio/requests/latest.txt)" >> "$GITHUB_ENV"
            echo "CLIP_COUNT=3" >> "$GITHUB_ENV"
          fi
      - name: Run free clip pipeline
        run: python kesit_studio/free_pipeline.py --url "$YOUTUBE_URL" --count "$CLIP_COUNT"
      - name: Package ZIP
        run: |
          cd out
          zip -r "../kesit-studio-${{ github.run_id }}.zip" .
      - name: Upload MP4, SRT and metadata
        uses: actions/upload-artifact@v4
        with:
          name: kesit-studio-${{ github.run_id }}
          path: |
            out/*.mp4
            out/*.srt
            out/metadata.json
            out/manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kesit-studio-zip-${{ github.run_id }}
          path: kesit-studio-${{ github.run_id }}.zip
          retention-days: 7
          if-no-files-found: error
