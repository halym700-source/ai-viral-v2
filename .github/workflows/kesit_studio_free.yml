name: Kesit Studio - Free YouTube Clips

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube video URL"
        required: true
        type: string
      clip_count:
        description: "Number of clips"
        required: true
        default: "5"
        type: string
      youtube_url:
        description: "YouTube URL"
        required: false
        default: ""
        type: string
      layout:
        description: "Layout"
        required: false
        default: "auto"
        type: string
      subtitle_style:
        description: "Subtitle style"
        required: false
        default: "bold"
        type: string
      source_url:
        description: "Netlify uploaded video source URL"
        required: false
        default: ""
        type: string
      upload_id:
        description: "Netlify upload ID"
        required: false
        default: ""
        type: string
      chunk_count:
        description: "Number of uploaded chunks"
        required: false
        default: "0"
        type: string
      filename:
        description: "Uploaded filename"
        required: false
        default: "uploaded_video.mp4"
        type: string
  issues:
    types: [opened]
  push:
    paths:
      - 'kesit_studio/requests/**'

permissions:
  contents: read

concurrency:
  group: kesit-studio-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || startsWith(github.event.issue.title, '[Kesit Studio]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video AI dependencies
        run: |
          python -m pip install --disable-pip-version-check -U yt-dlp faster-whisper opencv-python-headless
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Prepare request inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_URL: ${{ inputs.youtube_url }}
          DISPATCH_COUNT: ${{ inputs.clip_count }}
          DISPATCH_SOURCE_URL: ${{ inputs.source_url }}
          DISPATCH_UPLOAD_ID: ${{ inputs.upload_id }}
          DISPATCH_CHUNK_COUNT: ${{ inputs.chunk_count }}
          DISPATCH_FILENAME: ${{ inputs.filename }}
          DISPATCH_YOUTUBE_URL: ${{ inputs.youtube_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$DISPATCH_YOUTUBE_URL" ]; then
              echo "YOUTUBE_URL=$DISPATCH_YOUTUBE_URL" >> "$GITHUB_ENV"
            elif [ -n "$DISPATCH_SOURCE_URL" ]; then
              mkdir -p work
              echo "Downloading uploaded video in chunks..."
              for i in $(seq 0 $((DISPATCH_CHUNK_COUNT - 1))); do
                curl -L --fail --retry 3 "$DISPATCH_SOURCE_URL&chunk=$i" >> work/uploaded_video
              done
              echo "VIDEO_FILE=$GITHUB_WORKSPACE/work/uploaded_video" >> "$GITHUB_ENV"
            else
              echo "No YouTube URL or uploaded video source." >&2
              exit 1
            fi
            echo "CLIP_COUNT=$DISPATCH_COUNT" >> "$GITHUB_ENV"
            echo "LAYOUT=${{ inputs.layout || 'auto' }}" >> "$GITHUB_ENV"
            echo "SUBTITLE_STYLE=${{ inputs.subtitle_style || 'bold' }}" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "issues" ]; then
            # Prefer a GitHub user-attachment over any other URL in the issue.
            FILE_URL=$(printf "%s\n" "$ISSUE_BODY" | grep -Eo "https?://[^ )\n]*user-attachments/assets/[^ )\n]+" | head -n 1 || true)
            URL=$(printf "%s\n" "$ISSUE_BODY" | grep -Eo "https?://(www\.)?(youtube\.com|youtu\.be)/[^ )\n]+" | head -n 1 || true)

            if [ -n "$FILE_URL" ]; then
              mkdir -p work
              echo "Downloading attached video..."
              curl -L --fail --retry 3 "$FILE_URL" -o work/uploaded_video
              echo "VIDEO_FILE=$GITHUB_WORKSPACE/work/uploaded_video" >> "$GITHUB_ENV"
            elif [ -n "$URL" ]; then
              echo "YOUTUBE_URL=$URL" >> "$GITHUB_ENV"
            else
              echo "No YouTube URL or GitHub video attachment found in issue." >&2
              exit 1
            fi

            # Read "Clip count: N" or "clips: N" from the issue; default to 3.
            COUNT=$(printf "%s\n" "$ISSUE_BODY" | grep -Eio "(clip count|clips?|kesit sayısı)[[:space:]]*:[[:space:]]*[0-9]+" | grep -Eo "[0-9]+" | head -n 1 || true)
            if [ -z "$COUNT" ]; then COUNT=3; fi
            echo "CLIP_COUNT=$COUNT" >> "$GITHUB_ENV"
            LAYOUT=$(printf "%s\n" "$ISSUE_BODY" | grep -Eio "Layout:[[:space:]]*(auto|center|webcam-top)" | grep -Eio "(auto|center|webcam-top)" | head -n 1 || true)
            SUBTITLE_STYLE=$(printf "%s\n" "$ISSUE_BODY" | grep -Eio "Subtitle style:[[:space:]]*(bold|classic|yellow|minimal)" | grep -Eio "(bold|classic|yellow|minimal)" | head -n 1 || true)
            if [ -z "$LAYOUT" ]; then LAYOUT=auto; fi
            if [ -z "$SUBTITLE_STYLE" ]; then SUBTITLE_STYLE=bold; fi
            echo "LAYOUT=$LAYOUT" >> "$GITHUB_ENV"
            echo "SUBTITLE_STYLE=$SUBTITLE_STYLE" >> "$GITHUB_ENV"

            echo "ISSUE_BODY<<EOF" >> "$GITHUB_ENV"
            echo "$ISSUE_BODY" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          else
            echo "YOUTUBE_URL=$(head -n 1 kesit_studio/requests/latest.txt)" >> "$GITHUB_ENV"
            echo "CLIP_COUNT=3" >> "$GITHUB_ENV"
          fi
      - name: Run free clip pipeline
        run: |
          if [ -n "${VIDEO_FILE:-}" ]; then
            python kesit_studio/free_pipeline.py --file "$VIDEO_FILE" --count "$CLIP_COUNT" --layout "$LAYOUT" --subtitle-style "$SUBTITLE_STYLE"
          else
            python kesit_studio/free_pipeline.py --url "$YOUTUBE_URL" --count "$CLIP_COUNT" --layout "$LAYOUT" --subtitle-style "$SUBTITLE_STYLE"
          fi
      - name: Package ZIP
        run: |
          cd out
          zip -r "../kesit-studio-${{ github.run_id }}.zip" .
      - name: Upload MP4, SRT and metadata
        uses: actions/upload-artifact@v4
        with:
          name: kesit-studio-${{ github.run_id }}
          path: |
            out/*.mp4
            out/*.srt
            out/metadata.json
            out/manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kesit-studio-zip-${{ github.run_id }}
          path: kesit-studio-${{ github.run_id }}.zip
          retention-days: 7
          if-no-files-found: error
