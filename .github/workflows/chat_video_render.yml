name: Chat Shorts Renderer
run-name: Chat ${{ inputs.lang }} ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      lang:
        description: English (en) or Turkish (tr)
        required: true
        type: choice
        options: [en, tr]
      job_id:
        description: Unique ID created by n8n
        required: true
        type: string
      dialogue_json:
        description: A JSON object containing dialogue and chatTitle
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chat-render-${{ inputs.lang }}-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python -m pip install --disable-pip-version-check pillow==11.3.0 pydub==0.25.1 edge-tts==7.3.1
      - name: Generate chat video
        env:
          CHAT_LANG: ${{ inputs.lang }}
          CHAT_JSON: ${{ inputs.dialogue_json }}
        run: python chat_renderer/render.py
      - name: Upload finished video artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-${{ inputs.lang }}-${{ inputs.job_id }}
          path: out/short.mp4
          if-no-files-found: error
          retention-days: 2
