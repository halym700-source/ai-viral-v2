name: Chat Shorts Renderer
run-name: Chat ${{ inputs.lang }} ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      lang:
        description: English (en) or Turkish (tr)
        required: true
        type: choice
        options: [en, tr]
      job_id:
        description: Unique ID created by n8n
        required: true
        type: string
      dialogue_json:
        description: A JSON object containing dialogue and chatTitle
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chat-render-${{ inputs.lang }}-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render dependencies
        run: |
          # Use a bundled static FFmpeg for rendering and audio decoding.
          python -m pip install --disable-pip-version-check pillow==11.3.0 pydub==0.25.1 edge-tts==7.3.1 gTTS==2.5.4 imageio-ffmpeg==0.6.0 numpy==2.2.6
          # The renderer decodes audio with the bundled static FFmpeg binary.
          # Avoid apt-get / ffprobe: Ubuntu runner package mirrors can hang.
          mkdir -p "$RUNNER_TEMP/textvibe-bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/textvibe-bin/ffmpeg"
          echo "$RUNNER_TEMP/textvibe-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/textvibe-bin/ffmpeg" -version | head -n 1
      - name: Generate chat video
        env:
          CHAT_JOB_ID: ${{ inputs.job_id }}
          CHAT_LANG: ${{ inputs.lang }}
          CHAT_JSON: ${{ inputs.dialogue_json }}
          CHAT_TTS_PROVIDER: ${{ vars.CHAT_TTS_PROVIDER || 'edge' }}
          CHAT_GOOGLE_FALLBACK: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
        run: python chat_renderer/render.py
      - name: Upload finished video artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-${{ inputs.lang }}-${{ inputs.job_id }}
          path: out/short.mp4
          if-no-files-found: error
          retention-days: 2
