name: Motorcycle Original Audio Commons Preview
on:
  push:
    paths:
      - .github/workflows/motorcycle_crash_preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer
        run: |
          python -m pip install pillow==11.3.0 imageio-ffmpeg==0.6.0 edge-tts==7.3.1
          mkdir -p "$RUNNER_TEMP/rank-bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/rank-bin/ffmpeg"
          echo "$RUNNER_TEMP/rank-bin" >> "$GITHUB_PATH"
      - name: Prepare five CC licensed motorcycle videos with original audio
        run: python ranking_renderer/source_wikimedia_motorcycle_audio.py
      - name: Render 24-second Shorts with mandatory original sound on every clip
        env:
          RANKING_MANIFEST: out/ranking_manifest.json
        run: python ranking_renderer/render.py
      - uses: actions/upload-artifact@v4
        with:
          name: motorcycle-original-audio-${{ github.run_id }}
          path: |
            out/ranking_short.mp4
            out/ranking_sources.json
            out/ATTRIBUTION.txt
            out/ranking_manifest.json
          retention-days: 7
          if-no-files-found: error
