name: Deploy Kesit Studio Mobile

on:
  push:
    paths:
      - 'kesit_studio/mobile/**'
      - '.github/workflows/deploy_kesit_studio_mobile.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "kesit-studio-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'kesit_studio/mobile'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
