name: ReshRanks Viral Research
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      YOUTUBE_RESEARCH_API_KEY: ${{ secrets.YOUTUBE_RESEARCH_API_KEY }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check research API connection
        id: ready
        run: |
          if [ -n "$YOUTUBE_RESEARCH_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Research not yet enabled: add YOUTUBE_RESEARCH_API_KEY in Actions secrets."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Research viral real-footage candidates (no downloading)
        if: steps.ready.outputs.enabled == 'true'
        run: python ranking_renderer/viral_discovery.py
      - name: Prepare authenticity and reuse-rights review queue
        if: steps.ready.outputs.enabled == 'true'
        run: python ranking_renderer/rights_review.py
      - name: Research YouTube, Instagram, X and TikTok creator discovery
        run: python ranking_renderer/multiplatform_discovery.py
      - name: Save research shortlist
        uses: actions/upload-artifact@v4
        with:
          name: reshranks-viral-research-${{ github.run_id }}
          path: |
            out/viral_research.json
            out/viral_research.csv
            out/rights_review_queue.csv
            out/multiplatform_research.json
            out/multiplatform_research.csv
          retention-days: 14
          if-no-files-found: error
